# Free public demo of the API on Render: Dashboard → New → Blueprint → choose this repository.
#
# Demo mode (YUSR_DEMO): seeded cases and donors in memory — they reset whenever the service
# restarts or wakes from sleep — and the payment simulator only. No database, no real money.
# The website and the control hub run on Vercel (apps/web/vercel.json, apps/admin/vercel.json).
# A real deployment is described in docs/GUIDE.ar.md, section 9.
services:
  - type: web
    name: yusr-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - packages/**
        - infra/docker/api.Dockerfile
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: YUSR_DEMO
        value: 'true'
      - key: YUSR_STORAGE
        value: memory
      - key: YUSR_RELEASE
        value: demo
      # Fresh random secrets, generated by Render once.
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: NATIONAL_ID_PEPPER
        generateValue: true
      - key: RECEIPT_TOKEN_SECRET
        generateValue: true
      - key: SIMULATOR_SECRET
        generateValue: true
      - key: DATA_KEY_BASE64
        generateValue: true
      # The website and the control hub on Vercel, e.g. https://yusr-web.vercel.app
      - key: PUBLIC_WEB_URL
        sync: false
      - key: PUBLIC_ADMIN_URL
        sync: false
      # The website's address again (uploads from the case submission form).
      - key: CORS_ORIGINS
        sync: false
