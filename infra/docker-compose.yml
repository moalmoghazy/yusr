# Local infrastructure for Yusr: PostgreSQL 16, Redis 7 and S3-compatible storage (MinIO).
#   pnpm infra:up          → databases only (run the apps with `pnpm dev`)
#   docker compose -f infra/docker-compose.yml --profile apps up --build
#                          → also the API, worker, website and control hub in containers
name: yusr

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yusr
      POSTGRES_PASSWORD: yusr
      POSTGRES_DB: yusr
    ports: ['5432:5432']
    volumes: ['postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yusr -d yusr']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible storage standing in for Cloudflare R2 / S3: a private bucket for case documents
  # and a public one for redacted copies. Console at http://localhost:9001 (yusr / yusr-secret).
  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: yusr
      MINIO_ROOT_PASSWORD: yusr-secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 yusr yusr-secret &&
        mc mb --ignore-existing local/yusr-documents local/yusr-public &&
        mc anonymous set download local/yusr-public &&
        mc version enable local/yusr-documents &&
        echo "buckets ready"

  # ------------------------------------------------------------------ apps (profile: apps)
  # Applies the SQL migrations once, then exits; the API starts after it succeeds.
  migrate:
    profiles: ['apps']
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    command: ['node', 'dist/db/migrate.js']
    environment:
      DATABASE_URL: postgres://yusr:yusr@postgres:5432/yusr
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: ['apps']
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    env_file: ../packages/api/.env
    environment:
      NODE_ENV: production
      YUSR_STORAGE: postgres
      DATABASE_URL: postgres://yusr:yusr@postgres:5432/yusr
      REDIS_URL: redis://redis:6379
      # The API only signs upload/download links (it never calls storage itself), so the endpoint
      # is the address the browser uses.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: yusr
      S3_SECRET_ACCESS_KEY: yusr-secret
      S3_PRIVATE_BUCKET: yusr-documents
      S3_PUBLIC_BUCKET: yusr-public
      S3_PUBLIC_BASE_URL: http://localhost:9000/yusr-public
      RUN_WORKER: 'false'
    ports: ['4000:4000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-setup: { condition: service_completed_successfully }

  worker:
    profiles: ['apps']
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    command: ['node', 'dist/notifications/worker.main.js']
    env_file: ../packages/api/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://yusr:yusr@postgres:5432/yusr
      REDIS_URL: redis://redis:6379
    depends_on:
      api: { condition: service_started }

  web:
    profiles: ['apps']
    build: { context: .., dockerfile: infra/docker/next.Dockerfile, args: { APP: web, NEXT_PUBLIC_SITE_URL: 'http://localhost:3000' } }
    environment:
      YUSR_API_URL: http://api:4000/v1
      UPLOAD_ORIGIN: http://localhost:9000
    ports: ['3000:3000']
    depends_on:
      api: { condition: service_started }

  admin:
    profiles: ['apps']
    build: { context: .., dockerfile: infra/docker/next.Dockerfile, args: { APP: admin } }
    environment:
      YUSR_API_URL: http://api:4000/v1
    ports: ['3001:3000']
    depends_on:
      api: { condition: service_started }

volumes:
  postgres:
  redis:
  minio:
